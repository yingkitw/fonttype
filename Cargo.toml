[package]
name = "fonttype"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[bin]]
name = "fonttype"
path = "src/main.rs"

[lib]
name = "fonttype"
path = "src/lib.rs"

